[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-webradio"
dynamic = ["version"]
description = "Internet radio stations from the radio-browser.info directory"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    {name = "Dmitry Savin", email = "envelsavinds@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

dependencies = [
    # 3.22: ModuleCapability.RANKED_SEARCH, which keeps the most played matches first.
    "kalinka-plugin-sdk>=3.22,<4",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1", "setuptools-scm>=8", "flake8>=7"]

[project.entry-points."kalinka.plugins"]
kalinka_plugin_webradio = "kalinka_plugin_webradio:KalinkaPluginWebRadio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalinka_plugin_webradio = ["icons/*.svg"]

[tool.setuptools_scm]
write_to = "src/kalinka_plugin_webradio/_version.py"
tag_regex = "^kalinka-plugin-webradio-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match kalinka-plugin-webradio-v*"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
search_parent_directories = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--tb=short",
    "--strict-markers",
]
markers = [
    "smoke: smoke tests for basic functionality",
    "integration: integration tests",
]